name: Feature request
description: Suggest a gameplay or technical feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / motivation }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
