# Local development: Postgres + API (tsx watch) + client (Vite HMR).
#   docker compose up
# Without Docker, `pnpm dev` runs client and server directly (server works without a DB).
x-node: &node
  image: node:24-alpine
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - client_node_modules:/app/apps/client/node_modules
    - server_node_modules:/app/apps/server/node_modules
    - shared_node_modules:/app/packages/shared/node_modules
    - pnpm_store:/pnpm-store
  environment:
    CI: "true"
    # Keep the pnpm store out of the bind-mounted repo.
    npm_config_store_dir: /pnpm-store

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spin
      POSTGRES_PASSWORD: spin
      POSTGRES_DB: spin
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin"]
      interval: 5s
      retries: 10

  install:
    <<: *node
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --ignore-scripts"

  server:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @spin-doctor/server exec drizzle-kit migrate && pnpm --filter @spin-doctor/server dev"
    environment:
      DATABASE_URL: postgres://spin:spin@db:5432/spin
      PORT: "3000"
    ports: ["${SERVER_PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }
      install: { condition: service_completed_successfully }

  client:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @spin-doctor/client exec vite --host 0.0.0.0 --port 5173"
    ports: ["${CLIENT_PORT:-5173}:5173"]
    depends_on:
      install: { condition: service_completed_successfully }

volumes:
  pgdata:
  node_modules:
  client_node_modules:
  server_node_modules:
  shared_node_modules:
  pnpm_store:
