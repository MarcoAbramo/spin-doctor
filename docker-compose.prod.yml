# Production on a VPS:  cp .env.example .env && docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: { context: ., dockerfile: apps/client/Dockerfile }
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [server]

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    restart: unless-stopped
    command: sh -c "node dist/migrate.js && node dist/index.js"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
